);
let ch = CHARS[0], clones = [];  // 分身リスト（ヨミの影分身 / ゴローの岩の壁）

const BOSSES = [
 {sub:'コダマ',hp:500,size:40,color:'#7bd66b',pts:3,spiky:false,moveInt:70,moveSpd:4,chase:0,jump:-9,jumpP:0.4,shootInt:95,pattern:'single',
  desc:['HP 500','森の木霊','追尾弾を単発']},
 {sub:'ツムジ',hp:700,size:42,color:'#6bd6e6',pts:4,spiky:false,moveInt:45,moveSpd:6,chase:1.2,jump:-10,jumpP:0.6,shootInt:80,pattern:'fan3',
  desc:['HP 700','旋風の獣','3方向弾']},
 {sub:'ライジン',hp:950,size:46,color:'#ffd84e',pts:6,spiky:true,moveInt:35,moveSpd:7,chase:1.8,jump:-10.5,jumpP:0.7,shootInt:65,pattern:'storm',
  desc:['HP 950','雷神','5方向弾+高速追尾']},
 {sub:'オロチ',hp:1300,size:52,color:'#a066ff',pts:8,spiky:true,moveInt:28,moveSpd:8,chase:2.2,jump:-11,jumpP:0.8,shootInt:55,pattern:'chaos',
  desc:['HP 1300','八つ首の大蛇','全方位弾+追尾弾']}
];
let bossLv = 0, bossCfg = BOSSES[0];

let player = { x:100, y:350, w:30, h:30, vx:0, vy:0, speed:2.8, jumpPower:-9.5, isGround:false, hp:100 };
let boss = { x:650, y:340, w:40, h:40, vx:2.0, vy:0, jumpPower:-9.0, isGround:false, hp:500, maxHp:500, moveTimer:0 };

// 足場：床 + 3段 × 2列 × 左右 = 各陣営6枚（段差80px。platforms[0]は床）
const platforms = [{x:0,y:400,w:800,h:50}];   // [0]は床。足場の並びは setLayout() で作る

let bullets = [];
let bossBullets = [];
const keys = { left:false, right:false };

// 足場の上で↓：その足場をすり抜けて降りる（床では無効）
function dropDown() {
    if (gameState === "playing" && player.isGround && player.standing && player.standing !== platforms[0]) {
        player.dropPlat = player.standing; player.isGround = false; player.vy = 1;
    }
}
function jump() {
    if (gameState === "playing" && player.isGround) { player.vy = player.jumpPower; player.isGround = false; }
    else if (gameState === "bossSelect") resetGame();
}

window.addEventListener('keydown', e => {
    if (e.target && e.target.tagName === 'INPUT') return;   // ログイン欄などに入力中
    if ((e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A')) keys.left = true;
    if ((e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D')) keys.right = true;
    if ((e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W')) { e.preventDefault(); if (gameState === "playing") jump(); }
    if ((e.key === 'ArrowDown' || e.key === 's' || e.key === 'S')) { e.preventDefault(); dropDown(); }
    if ((e.key === 'r' || e.key === 'R') && (gameState === "clear" || gameState === "gameover")) { if (pvp && !online) requestRematch(); else resetGame(); }
    if (e.key === 'Escape' && pvp && !online && (gameState === "clear" || gameState === "gameover")) leaveRoom();
    if ((e.key === 'Escape' || e.key === 'p' || e.key === 'P') && !pvp) {   // ポーズ / 再開
        if (gameState === "playing") { gameState = "paused"; stick.x = stick.y = 0; } else if (gameState === "paused") gameState = "playing";
    }
    if (gameState === "mode" && (e.key === 'h' || e.key === 'H')) { helpPage = 0; gameState = "help"; }
    if ((gameState === "help" || gameState === "ranking" || gameState === "gacha" || gameState === "equip") && e.key === 'Escape') gameState = "mode";
    if (gameState === "mode" && /^[1234]$/.test(e.key)) pickMode(+e.key - 1);
    else if (gameState === "select" && /^[1-9]$/.test(e.key)) { const c = roster().slice(selPage * 8, selPage * 8 + 8)[+e.key - 1]; if (c) chooseChar(CHARS.indexOf(c)); }
    else if (gameState === "bossSelect" && /^[1-4]$/.test(e.key)) startGame(+e.key - 1);
    if (gameState === "bossSelect" && e.key === 'Escape') resetGame();
    if (gameState === "storySelect" && e.key === 'Escape') gameState = "select";
    if (gameState === "storyIntro" && e.key === 'Escape') gameState = "storySelect";
    if (gameState === "storySelect" && /^[1-9]$/.test(e.key) && +e.key - 1 <= storyProg) { storyStage = +e.key - 1; gameState = "storyIntro"; }
});
window.addEventListener('blur', () => { keys.left = keys.right = false; });
window.addEventListener('keyup', e => {
    if ((e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A')) keys.left = false;
    if ((e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D')) keys.right = false;
});
// --- 入力：画面スティック / ゲームパッド（十字キー・左スティック）---
// 倒した向きに移動。真横から45度以上（上/下に）倒すとジャンプ/降りる。
const stick = { x:0, y:0 }, stickEl = document.getElementById('stick');
let stickVis = false, dropLatch = false;
const zoneEl = document.getElementById('stickZone'), pauseBtn = document.getElementById('pauseBtn');
const leaveBtn = document.getElementById('leaveBtn'); let leaveArmed = 0;   // 友達対戦中の「退出」ボタン（うっかり防止で2回押し）
leaveBtn.addEventListener('click', () => {
    if (Date.now() - leaveArmed < 3000) { leaveRoom(); return; }
    leaveArmed = Date.now(); leaveBtn.textContent = 'もう一度押すと退出';
    setTimeout(() => { if (Date.now() - leaveArmed >= 2900) { leaveArmed = 0; leaveBtn.textContent = '退出'; } }, 3000);
});
pauseBtn.addEventListener('click', () => { if (gameState === "playing" && !pvp) { gameState = "paused"; stick.x = stick.y = 0; } });
(() => {
    const knob = document.getElementById('knob'), R = 44, HALF = 60;
    let pid = null;
    const move = e => {
        const r = stickEl.getBoundingClientRect();
        let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
        const d = Math.hypot(dx, dy); if (d > R) { dx *= R / d; dy *= R / d; }
        stick.x = dx / R; stick.y = dy / R;
        knob.style.transform = `translate(${dx}px,${dy}px)`;
    };
    const place = e => { // 触った場所にスティックを出す（画面のどこでもOK）
        const cx = Math.max(HALF + 8, Math.min(innerWidth - HALF - 8, e.clientX));
        const cy = Math.max(HALF + 8, Math.min(innerHeight - HALF - 8, e.clientY));
        stickEl.style.left = (cx - HALF) + 'px'; stickEl.style.top = (cy - HALF) + 'px'; stickEl.style.bottom = 'auto';
    };
    const end = e => {
        if (e.pointerId !== pid) return;
        pid = null; stick.x = stick.y = 0; knob.style.transform = '';
        stickEl.style.left = stickEl.style.top = stickEl.style.bottom = '';   // 初期位置へ戻る
    };
    zoneEl.addEventListener('pointerdown', e => { e.preventDefault(); if (pid !== null) return; pid = e.pointerId; try { zoneEl.setPointerCapture(pid); } catch (_) {} place(e); move(e); });
    zoneEl.addEventListener('pointermove', e => { if (e.pointerId === pid) move(e); });
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => zoneEl.addEventListener(t, end));
    zoneEl.addEventListener('contextmenu', e => e.preventDefault());
})();
function pollInput() {
    let px = 0, py = 0;
    const gp = navigator.getGamepads ? [...navigator.getGamepads()].find(g => g && g.connected) : null;
    if (gp) {
        px = gp.axes[0] || 0; py = gp.axes[1] || 0;
        const B = i => gp.buttons[i] && gp.buttons[i].pressed;
        if (B(14)) px = -1; if (B(15)) px = 1; if (B(12)) py = -1; if (B(13)) py = 1;
    }
    const sx = Math.abs(stick.x) >= Math.abs(px) ? stick.x : px;
    const sy = Math.abs(stick.y) >= Math.abs(py) ? stick.y : py;
    const steep = Math.hypot(sx, sy) >= 0.5 && Math.abs(sy) >= Math.abs(sx); // 45度以上
    if (steep && sy < 0) jump();                                          // 上：ジャンプ（着地中のみ）
    if (steep && sy > 0) dropDown();                                      // 下：降りる（倒し続けると着地のたびに次の足場も降りる）
    return { left: sx < -0.25, right: sx > 0.25 };
}

function resetGame() { // ボス戦→キャラ選択へ / 対人戦→モード選択へ

function chooseChar(i) {
    if (!CHARS[i]) return;
    ch = CHARS[i];
    if (pvp && inRoom) {   // 友達対戦の再戦：接続はそのままで、キャラだけ選び直す
        if (oppLeft) return;
        mySelected = true; sentHello = false; sayHello();
        if (oppReady) startPvp(); else { gameState = "lobby"; showLobby(true); }
    } else if (pvp) { gameState = "lobby"; showLobby(true); if (online) { matching = true; matchStart = Date.now(); settled = false; findMatch(); } }
    else gameState = story ? "storySelect" : "bossSelect";
}
function startGame(lv) {
    setLayout('a'); bn = equipBonus(ch.id); costAcc = 0; sched = [];   // 装備ボーナスを有効に
    bossLv = lv; bossCfg = BOSSES[lv];

    Object.assign(boss, { x:650, y:340, vx:2.0, vy:0, w:bossCfg.size, h:bossCfg.size, hp:bossCfg.hp,
                          maxHp:bossCfg.hp, jumpPower:bossCfg.jump, moveTimer:0, atk:0, dropPlat:null, standing:null, poisonT:0, poisonD:0, stunT:0 });
    bullets = []; bossBullets = []; clones = [];
    ammo = 30; shotCooldown = 0; bossShootCooldown = 0; currentGesture = "No Hand";
    player.hp = maxHP();   // 最大HPの装備ボーナス
    lastHp = player.hp; lastEh = boss.hp; hurtT = 0; hurtParts = []; dmgTexts = [];
    gameState = "playing";
}
canvasElement.addEventListener('pointerdown', e => {
    window.focus();
    if (gameState === "paused") {   // ポーズ画面：再開 / キャラ選択へ
        const r1 = canvasElement.getBoundingClientRect();
        const px = (e.clientX - r1.left) * 800 / r1.width, py = (e.clientY - r1.top) * 450 / r1.height;
        if (px > 250 && px < 550) { if (py > 200 && py < 252) gameState = "playing"; else if (py > 270 && py < 322) resetGame(); }
        return;

        return;
    }
    if (gameState === "mode") {
        const r0 = canvasElement.getBoundingClientRect();
        const mx = (e.clientX - r0.left) * 800 / r0.width, my = (e.clientY - r0.top) * 450 / r0.height;
        if (my > 80 && my < 120) { showName(); return; }   // 名前の行をタップ → 名前変更
        if (my > 375) {   // 下のボタン：ランキング / あそびかた / ログイン
            if (mx < 162) { gameState = "gacha"; gachaRes = []; gAnim = null; gacha.giftNew = false; saveGacha(); } else if (mx < 319) { gameState = "equip"; eqPage = 0; }
            else if (mx < 476) openRanking(); else if (mx < 633) { helpPage = 0; gameState = "help"; } else showAuth();
            return;
        }
        const idx = Math.max(0, Math.min(3, Math.floor((mx - 8) / 195)));
        pickMode(idx); return;
    }
    if (gameState === "gacha") { gachaTap(e); return; }
    if (gameState === "equip") { equipTap(e); return; }
    if (gameState === "storyIntro") { startStory(storyStage); return; }
    if (gameState === "storySelect") { storySelectTap(e); return; }
    if (gameState === "ranking") { gameState = "mode"; return; }
    if (gameState === "help") { if (++helpPage >= HELP.length) gameState = "mode"; return; }
    if (gameState !== "select" && gameState !== "bossSelect") return;
    const r = canvasElement.getBoundingClientRect();
    const x = (e.clientX - r.left) * 800 / r.width, y = (e.clientY - r.top) * 450 / r.height;
    const sel = gameState === "select", list = sel ? roster().slice(selPage * 8, selPage * 8 + 8) : BOSSES;
    if (sel) {   // ページ切りかえ（◀ ▶）

        if (inBox(x, y, 420, 414, 80, 28) && selPage < pages - 1) { selPage++; return; }
    }
    list.forEach((c, i) => {
        const cx = sel ? 15 + (i % 4) * 195 : 30 + i * 190, cy = sel ? 62 + ((i / 4) | 0) * 178 : 95;
        const cw = sel ? 185 : 170, chh = sel ? 170 : 305;
        if (x >= cx && x <= cx + cw && y >= cy && y <= cy + chh) sel ? chooseChar(CHARS.indexOf(c)) : startGame(i);
    });

});

// ジェスチャーの安定化（2回連続で同じ結果なら確定 → ちらつき防止）
let pendingGesture = "No Hand", pendingCount = 0;
function commitGesture(g) {
    if (g === pendingGesture) pendingCount++; else { pendingGesture = g; pendingCount = 1; }
    if (pendingCount >= 2 && g !== currentGesture) {
        currentGesture = g;
        setText(statusEl, `Gesture: ${g}`);

const EDGE_MARGIN = 0.1;   // カメラ画面の端から10%以内にある手は読み取らない（手のひらの中心で判定）
const inFrame = h => { const c = [0, 5, 9, 13, 17].reduce((a, i) => ({ x:a.x + h[i].x / 5, y:a.y + h[i].y / 5 }), { x:0, y:0 });
                       return c.x > EDGE_MARGIN && c.x < 1 - EDGE_MARGIN && c.y > EDGE_MARGIN && c.y < 1 - EDGE_MARGIN; };
let handRef = 0, nearTime = 0, smallSince = 0;   // 自分の手の基準の大きさ / 自分の手を最後に認識した時刻 / 小さい手だけが映り始めた時刻
hands.onResults(results => {
    let g = "No Hand";
    const lms = (results.multiHandLandmarks || []).filter(inFrame);   // 画面の端の手は除外
    if (lms && lms.length > 0) {
        // 画面上で一番大きく映っている手 = カメラに一番近い手だけを使う（後ろの手は無視）
        // 大きさは「手首〜中指の付け根」＋「人差し指〜小指の付け根」の長さ（指の開き具合に左右されにくい）
        const hsize = h => Math.hypot(h[0].x - h[9].x, h[0].y - h[9].y) + Math.hypot(h[5].x - h[17].x, h[5].y - h[17].y);
        let lm = lms[0];
        for (const h of lms) if (hsize(h) > hsize(lm)) lm = h;
        // 自分の手の大きさ(handRef)の6割に満たない手は「後ろの人の手」とみなして無視する
        // （自分の手が戻ってくれば、大きいのですぐ上書きされる）
        const sz = hsize(lm), now = performance.now();
        if (handRef > 0 && sz < handRef * 0.6) {
            if (now - nearTime < 700) return;                                    // 自分の手が一瞬外れただけ → 直前の判定を維持
            if (!smallSince) smallSince = now;
            if (now - smallSince < 6000) { commitGesture("No Hand"); return; }   // 自分の手がない → 後ろの手は無視（マナが回復できる）
            handRef = sz;                                                        // 6秒以上、小さい手しか映らない → 自分の位置が変わったとみなして基準を取り直す
        }
        smallSince = 0; nearTime = now;
        handRef = handRef ? handRef + (sz - handRef) * (sz > handRef ? 0.5 : 0.05) : sz;   // 基準を更新（大きくは素早く、小さくはゆっくり）
        const iOpen = lm[8].y < lm[6].y;
        const mOpen = lm[12].y < lm[10].y;
        const rOpen = lm[16].y < lm[14].y;
        const pOpen = lm[20].y < lm[18].y;
        if (!iOpen && !mOpen && !rOpen && !pOpen) g = "Rock";
        else if (iOpen && mOpen && !rOpen && !pOpen) g = "Scissors";
        else if (iOpen && mOpen && rOpen && pOpen) g = "Paper";
        else g = "Unknown";
    } else smallSince = 0;   // 手が全く映らない
    commitGesture(g);
});

    const bs = candidates(), ids = [{ id:queueId(bs[0]), d:0 }, { id:ANY_ID, d:200 }];

function becomeWaiter() {   // 待機部屋に入る：自分のレート帯の部屋と、みんなが探しにくる共通の部屋(ANY)に待機

        pvpMap = 'abcdefgh'[(Math.random() * 8) | 0];   // 今回のマップ（ランダム。相手にも伝える）

}

function sendState(force) {

// 相手の弾 → 分身 / 反射バリア / 自分 の順に当たり判定
function processOppBullets() {
    for (const [id, bx0, by, power, btype, bwarn] of opp.b) {
        if (dead.has(id)) continue;
        const bx = 800 - bx0;
        if (btype === 'cloud') {   // 毒霧：入っている間、一定間隔で毒をうける（霧は消えない）
            const now = performance.now();
            if (player.invuln <= 0 && Math.abs(bx - player.x) < 77 && Math.abs(by - player.y) < 45 && now - (beamT[id] || 0) > 400) {
                beamT[id] = now; player.hp = Math.max(0, player.hp - power); const pz = POISON.cloud; player.poisonT = pz[0]; player.poisonD = pz[1];
            }
            continue;
        }
        if (btype === 'beam') {   // 上からのレーザー：予備動作は無害。当たっている間は、少しずつ連続ダメージ
            const now = performance.now();
            if (!bwarn && player.invuln <= 0 && Math.abs(bx - player.x) < 22 && now - (beamT[id] || 0) > 133) { beamT[id] = now; player.hp = Math.max(0, player.hp - power); }
            continue;
        }
        let used = false;
        const dr = clones.find(c => c.drone && Math.hypot(bx - c.x, by - c.y) < 55);
        if (dr) { dr.hp -= power * 0.4; used = true; }   // 迎撃ドローンが撃ち落とす
        if (!used) for (let k = clones.length - 1; k >= 0; k--) {
            const c = clones[k];
            if (Math.abs(bx - c.x) < 20 && Math.abs(by - c.y) < 20) { c.hp -= power; if (c.hp <= 0) clones.splice(k, 1); used = true; break; }
        }
        if (!used && player.reflect > 0 && Math.hypot(bx - player.x, by - player.y) < 40) {
            const ra = Math.atan2(boss.y - by, boss.x - bx);   // 反射した瞬間の相手の位置に向け、そのあとは直進
            bullets.push({x:bx, y:by, vx:Math.cos(ra) * 6, vy:Math.sin(ra) * 6, power:18, type:'blaze', life:140});
            used = true;
        }
        if (!used && player.invuln <= 0 && Math.abs(bx - player.x) < 20 && Math.abs(by - player.y) < 20) {
            player.hp = Math.max(0, player.hp - power); used = true;
            const pz = POISON[btype]; if (pz) { player.poisonT = pz[0]; player.poisonD = pz[1]; }   // 毒を受ける
            if (btype === 'shock') player.stunT = 48;   // 麻痺を受ける
        }
        if (used) { dead.add(id); conn.send({ t:'k', id }); }
    }
    if (player.hp <= 0) { gameState = "gameover"; sendState(true); }
}

        else if (g === "Scissors" && ammo >= 5) {   // 毒だまり：相手側のステージのどこかに、約5秒だけ毒の範囲が1つ出る（場所はランダム。入ると毒）
            const ps = platforms.filter(p => p.x >= 400).concat([{ y:400 }]), p = ps[(Math.random() * ps.length) | 0];
            const zx = 470 + Math.random() * 260, zy = p.y < 400 ? p.y - 26 : 372;
            for (let i = bullets.length - 1; i >= 0; i--) if (bullets[i].type === 'cloud') bullets.splice(i, 1);   // 毒の範囲は同時に1つだけ
            bullets.push({ x:zx, y:zy, vx:0, vy:0, power:1, type:'cloud', bw:62, bh:30, multi:24, pierce:true, ttl:300, life:400 });

    case 'ber': // 狂戦士：HPが減るほど攻撃力アップ。パーはHPを払ってマナ全回復

        else if (g === "Paper" && player.hp > maxHP() * 0.2 && ammo < 28) { player.hp = Math.max(1, player.hp - Math.round(maxHP() * 0.12)); ammo = 30; player.haste = 150; shotCooldown = 200; }
        break;
    case 'luna': // 月：追尾月光と流星群
        if (g === "Scissors" && ammo >= 3) {
            for (const d of [-1, 1]) {   // ボスの弾と同じ仕様：撃った瞬間の相手の位置に向け、そのあとは直進
                const sy = y + d * 10, a = Math.atan2(boss.y - sy, boss.x - x);
                F({ y:sy, vx:Math.cos(a) * 5, vy:Math.sin(a) * 5, power:7, type:'moon', life:140 });
            }
            ammo -= 3; shotCooldown = 34;
        } else if (g === "Paper" && ammo >= 10) {
            for (let k = -2; k <= 2; k++) bullets.push({ x:boss.x + k * 38, y:-10, vx:0, vy:5, power:13, type:'meteor', life:140 });
            ammo -= 10; shotCooldown = 60;
        }
        break;
    }
    if (ch.id === 'ber' && bullets.length > n0) {   // 狂戦士：HPが減るほど、弾の威力アップ（最大 +90%）
        const m = 1 + (1 - player.hp / maxHP()) * 0.9;
        for (let i = n0; i < bullets.length; i++) bullets[i].power = Math.round(bullets[i].power * m);
    }
}

// --- 更新処理 ---
function update() {
    if (gameState !== "playing") return;
    const gravity = 0.45;

    const sp = player.speed * (player.haste > 0 ? 1.6 : 1) * (1 + bn.spd);
    const inp = pollInput();
    player.vx = 0;
    if (keys.left || inp.left) player.vx = -sp;
    if (keys.right || inp.right) player.vx = sp;
    player.vy += gravity;
    player.x += player.vx;
    player.y += player.vy;
    if (player.x < 15) player.x = 15;
    if (player.x > 385) player.x = 385;

    if (!pvp && boss.stunT > 0) boss.stunT--;
    if (!pvp) {
    if (boss.stunT > 0) { boss.vx = 0; } else if (bossCfg.move) { bossCfg.move(); } else {   // ストーリーの敵は専用の動き
    boss.moveTimer++;
    if (boss.moveTimer > bossCfg.moveInt) {
        // chase>0 のボスは中央（プレイヤー側）へ寄りやすく、プレイヤーが高所にいると飛び上がる
        boss.vx = (Math.random() - 0.5) * bossCfg.moveSpd - bossCfg.chase;
        // 足場の上にいるときは、プレイヤーが下にいるほど降りやすい
        const canDrop = boss.isGround && boss.standing && boss.standing !== platforms[0];
        if (canDrop && Math.random() < (player.y > boss.y + 60 ? 0.6 : 0.2)) {
            boss.dropPlat = boss.standing; boss.isGround = false; boss.vy = 1;
        } else if ((Math.random() < bossCfg.jumpP || (bossCfg.chase && player.y < boss.y - 60)) && boss.isGround) {
            boss.vy = boss.jumpPower; boss.isGround = false;
        }
        boss.moveTimer = 0;
    }
    boss.vy += gravity;
    boss.x += boss.vx;
    boss.y += boss.vy;
    if (boss.x < 415) { boss.x = 415; boss.vx *= -1; }
    if (boss.x > 785) { boss.x = 785; boss.vx *= -1; }
    }
    }

    player.isGround = false;
    boss.isGround = false;
    for (const p of platforms) {
        const pBottom = player.y + player.h/2, pPrev = pBottom - player.vy;
        if (player.dropPlat && p.y === player.dropPlat.y && pBottom > p.y + 20) player.dropPlat = null; // 十分降りたら解除
        if (!(player.dropPlat && p.y === player.dropPlat.y) && player.x + player.w/2 > p.x && player.x - player.w/2 < p.x + p.w &&
            pBottom >= p.y && pPrev <= p.y + 5 && player.vy >= 0) {
            player.y = p.y - player.h/2; player.vy = 0; player.isGround = true; player.standing = p;
        }
        const bBottom = boss.y + boss.h/2, bPrev = bBottom - boss.vy;
        if (boss.dropPlat && p.y === boss.dropPlat.y && bBottom > p.y + 20) boss.dropPlat = null;
        if (!pvp && !bossCfg.noPlat && !(boss.dropPlat && p.y === boss.dropPlat.y) && boss.x + boss.w/2 > p.x && boss.x - boss.w/2 < p.x + p.w &&
            bBottom >= p.y && bPrev <= p.y + 5 && boss.vy >= 0) {
            boss.y = p.y - boss.h/2; boss.vy = 0; boss.isGround = true; boss.standing = p;
        }
    }

    // 分身の更新（重力・着地・砲台の攻撃）
    clones = clones.filter(c => c.hp > 0);   // HPが0の分身（ドローン含む）を消す
    for (const c of clones) {
        if (c.drone) {   // ドローン：プレイヤーのそばをふわふわ飛ぶ。約10秒で消える
            c.x += (Math.max(15, Math.min(385, player.x + 34)) - c.x) * 0.1; c.y += (player.y - 26 - c.y) * 0.1;
            if (--c.ttl <= 0) c.hp = 0;
            continue;
        }
        c.vy += gravity; c.y += c.vy;
        const cb = c.y + 15, cp = cb - c.vy;
        for (const p of (c.floorOnly ? [platforms[0]] : platforms)) {
            if (c.x + 15 > p.x && c.x - 15 < p.x + p.w && cb >= p.y && cp <= p.y + 5 && c.vy >= 0) {
                c.y = p.y - 15; c.vy = 0;
            }
        }
        if (c.turret && ++c.t >= 100) {
            c.t = 0;
            c.flash = 8; bullets.push({x:c.x, y:c.y, vx:7.0, vy:0, power:22, type:'cannon', life:140});
        }
    }

    if (story && !pvp) storyTick();
    // ボスの攻撃
    if (!pvp) {
    if (!(boss.stunT > 0) && ++bossShootCooldown > bossCfg.shootInt * (bossCfg.rate || 1)) { bossShoot(); bossShootCooldown = 0; }
    for (let i = bossBullets.length - 1; i >= 0; i--) {
        const bb = bossBullets[i];
        bb.life--;
        if (bb.orbit !== undefined) {   // 鬼火：敵のまわりを回ったあと、そのときのプレイヤーの位置へ飛んでいく
            bb.oa += 0.09; bb.x = boss.x + Math.cos(bb.oa) * 48; bb.y = boss.y + Math.sin(bb.oa) * 48;
            if (--bb.orbit <= 0) { const a = Math.atan2(player.y - bb.y, player.x - bb.x); bb.vx = Math.cos(a) * 3.6; bb.vy = Math.sin(a) * 3.6; delete bb.orbit; }
            continue;
        }
        if (bb.vx !== undefined) {   // 速度で動く弾（雨・衝撃波・放物線・はねる弾）
            bb.x += bb.vx; bb.y += bb.vy; if (bb.grav) bb.vy += bb.grav;
            if (bb.bounce && bb.y > 392 && bb.vy > 0) { bb.vy *= -0.8; bb.bounce--; }
        } else {
        const t = clones.find(c => c.guard) || player; // 盾の分身があれば狙う
        if (bb.turn && Math.hypot(t.x - bb.x, t.y - bb.y) < 130) bb.turn = 0; // 当たる少し前で追尾をやめ、以降は直進
        let diff = Math.atan2(t.y - bb.y, t.x - bb.x) - bb.angle;
        while (diff < -Math.PI) diff += Math.PI*2;
        while (diff > Math.PI) diff -= Math.PI*2;
        bb.angle += diff * bb.turn;
        bb.x += Math.cos(bb.angle) * bb.speed;
        bb.y += Math.sin(bb.angle) * bb.speed;
        }

        const dr = clones.find(c => c.drone && Math.hypot(bb.x - c.x, bb.y - c.y) < 55);
        if (dr) { dr.hp -= (bb.dmg || 15) * 0.4; bossBullets.splice(i, 1); continue; }   // 迎撃ドローンが撃ち落とす
        if (hitClone(bb)) { bossBullets.splice(i, 1); continue; } // 分身に当たった弾は消える
        if (player.reflect > 0 && Math.hypot(bb.x - player.x, bb.y - player.y) < 40) {
            const ra = Math.atan2(boss.y - bb.y, boss.x - bb.x);   // 反射した瞬間の相手の位置に向け、そのあとは直進
            bullets.push({x:bb.x, y:bb.y, vx:Math.cos(ra) * 6, vy:Math.sin(ra) * 6, power:18, type:'blaze', life:140});
            bossBullets.splice(i, 1);
            continue;
        }
        if (player.invuln <= 0 && Math.abs(bb.x - player.x) < (bb.hw || 5) + 15 && Math.abs(bb.y - player.y) < (bb.hh || 5) + 15) {
            player.hp -= Math.max(1, Math.round((bb.dmg || 15) * (1 - bn.def)));   // 防御の装備
            bossBullets.splice(i, 1);
            if (player.hp <= 0) { player.hp = 0; gameState = "gameover"; }
            continue;
        }
        if (bb.life <= 0 || bb.x < -40 || bb.x > 840 || bb.y < -60 || bb.y > 450) bossBullets.splice(i, 1);
    }
    }

    // プレイヤーの攻撃 & 弾薬回復
    if (!pvp && boss.poisonT > 0 && boss.poisonT-- % 30 === 0) { boss.hp -= boss.poisonD; if (boss.hp <= 0) { boss.hp = 0; gameState = "clear"; if (story) storyCleared(); } }   // 毒でじわじわ減る
    if (player.poisonT > 0 && player.poisonT-- % 30 === 0) { player.hp -= player.poisonD; if (player.hp <= 0) { player.hp = 0; gameState = "gameover"; if (pvp) sendState(true); } }
    if (shotCooldown > 0) shotCooldown = Math.max(0, shotCooldown - (1 + bn.rate));   // 連射の装備
    if (player.haste > 0) player.haste--;
    if (player.healCd > 0) player.healCd--;
    if (player.thunder > 0) player.thunder--;
    if (player.thunderCd > 0) player.thunderCd--;
    if (player.reflectCd > 0) player.reflectCd--;
    if (player.stunT > 0) player.stunT--;
    if (player.invuln > 0) player.invuln--;
    if (player.reflect > 0) player.reflect--;
    if (currentGesture === "No Hand" && Math.random() < 0.18 * (1 + bn.regen) && ammo < 30) ammo++;   // マナ回復の装備
    runSched();
    const a0 = ammo; if (!(player.stunT > 0)) attack();   // 麻痺中は攻撃できない
    if (bn.cost && ammo < a0) { costAcc += (a0 - ammo) * bn.cost; while (costAcc >= 1) { costAcc--; ammo = Math.min(30, ammo + 1); } }   // マナ消費をおさえる装備

    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        if (b.track) b.x += (boss.x - b.x) * b.track;   // ゆっくり相手を追う弾（つむじ風）
        if (b.type === 'beam' && !b.fixed) b.x += (boss.x - b.x) * (b.delay > 0 ? 0.2 : 0.07);   // 上からのレーザーは、相手を追う
        if (b.delay > 0) { b.delay--; continue; } // 予備動作
        if (b.ttl !== undefined && --b.ttl <= 0) { bullets.splice(i, 1); continue; }   // レーザーが消えるまで
        if (b.explode && --b.explode <= 0) { // 時限爆弾：扇状に破片を飛ばす
            for (let k = -3; k <= 3; k++) { const a = k * 0.28; bullets.push({x:b.x, y:b.y, vx:Math.cos(a) * 6, vy:Math.sin(a) * 6, power:11, type:'frag', life:50}); }
            bullets.splice(i, 1); continue;
        }
        if (b.homing) {
            const a = Math.atan2(boss.y - b.y, boss.x - b.x);
            b.x += Math.cos(a) * b.spd; b.y += Math.sin(a) * b.spd;
        } else {
            if (b.ax) b.vx = Math.min(b.vmax, b.vx + b.ax);   // だんだん加速する弾
            if (b.boom) { b.vx -= 0.05; if (b.x > 790 && b.vx > 0) b.vx = 0; if (b.vx < 0 && !b.back) { b.back = true; b.hit = false; } } // ブーメランは戻ってくる
            b.x += b.vx;
            if (b.baseYo !== undefined) { b.angle += 0.12; b.y = b.baseYo + Math.sin(b.angle) * 35; }
            else { b.y += b.vy; if (b.grav) b.vy += b.grav; }
        }
        b.life--;

        if (!pvp && Math.abs(b.x - boss.x) < boss.w/2 + (b.bw || 0) && Math.abs(b.y - boss.y) < boss.h/2 + (b.bh || 0)) {
            if (!b.hit || (b.multi && --b.mc <= 0)) { // 貫通弾は1発につき1回（レーザーは連続ヒット）
                b.hit = true; b.mc = b.multi || 0;
                if (!boss.shield) {
                    boss.hp -= Math.max(1, Math.round(b.power * (1 + bn.atk)));   // 攻撃力の装備
                    const pz = POISON[b.type]; if (pz) { boss.poisonT = pz[0]; boss.poisonD = pz[1]; }   // 毒
                    if (b.type === 'shock') boss.stunT = 48;   // 麻痺
                    if (boss.hp <= 0) { boss.hp = 0; gameState = "clear"; if (story) storyCleared(); }
                }
            }
            if (!b.pierce) bullets.splice(i, 1);
            continue;
        }
        if ((b.homing && b.life <= 0) || b.x > 800 || b.x < -20 || b.y > 450 || b.y < -100) bullets.splice(i, 1);
    }

    if (pvp) sendState();
    setText(pHpEl, pvp ? `${playerName()} HP: ${player.hp}` : `HP: ${player.hp}`);
    setText(bHpEl, pvp ? `${oppName} HP: ${opp.hp}` : (story ? `${bossCfg.name} HP: ${boss.hp}` : `精霊 Lv${bossLv + 1} HP: ${boss.hp}`));
    setText(ammoEl, ammo === 0 ? 'マナ: 0 切れ！' : `マナ: ${ammo}`);
    ammoEl.style.color = ammo === 0 ? '#ff6b6b' : ammo <= 5 ? '#ffb347' : '';
}

// ボスの攻撃パターン
function bossShoot() {
    if (bossCfg.atk) { bossCfg.atk(++boss.atk); return; }   // ストーリーの敵は専用の攻撃
    const a = Math.atan2(player.y - boss.y, player.x - boss.x);
    const mk = (ang, sp, turn) => bossBullets.push({ x:boss.x, y:boss.y, speed:sp, angle:ang, life:300, turn:0 }); // 追尾なし：発射時にプレイヤーへ向け、あとは直進
    const n = ++boss.atk;
    switch (bossCfg.pattern) {
        case 'single': mk(a, 2.8, 0.02); break; // Lv1：追尾を弱く（旋回 0.05 → 0.02）
        case 'fan3': for (const d of [-0.3, 0, 0.3]) mk(a + d, 3.0, 0.02); break;
        case 'storm':
            if (n % 2) for (let d = -2; d <= 2; d++) mk(a + d * 0.25, 3.2, 0);
            else [3.6, 4.2, 4.8].forEach(sp => mk(a, sp, 0.04));
            break;
        case 'chaos':
            if (n % 2) { for (let k = 0; k < 12; k++) mk(k * Math.PI / 6 + n * 0.2, 2.4, 0); mk(a, 3.4, 0.05); }
            else [-0.15, 0, 0.15].forEach(d => mk(a + d, 4.2, 0.03));
            break;
    }
}

function drawBossShape(c, x, y, w) {
    const r = w * 0.6, m = c.spiky ? c.pts * 2 : c.pts, p = [];
    for (let i = 0; i < m; i++) {
        const rr = c.spiky && i % 2 ? r * 0.5 : r, ang = -Math.PI / 2 + i * 2 * Math.PI / m;
        p.push([Math.cos(ang) * rr, Math.sin(ang) * rr]);
    }
    const off = w / 2 - Math.max(...p.map(q => q[1])); // 足元をヒットボックス下端に合わせる
    ctx.fillStyle = c.color; ctx.beginPath();
    p.forEach((q, i) => i ? ctx.lineTo(x + q[0], y + q[1] + off) : ctx.moveTo(x + q[0], y + q[1] + off));
    ctx.closePath(); ctx.fill();
}

// ボスの弾が分身に当たったら耐久を減らし、0で壊れる（砲台は1発・盾は2発）
function hitClone(bb) {
    for (let k = clones.length - 1; k >= 0; k--) {
        const c = clones[k];
        if (Math.abs(bb.x - c.x) < 20 && Math.abs(bb.y - c.y) < 20) {
            c.hp -= (bb.dmg || 15); if (c.hp <= 0) clones.splice(k, 1);
            return true;
        }
    }
    return false;
}

function storyTick() {   // ストーリーの敵の仕掛け（予告・レーザーなど）を毎フレーム進める
    boss.t++; if (boss.flash > 0) boss.flash--;

    if (player.hurtCd > 0) player.hurtCd--;

        laser.t++;
        const act = laser.t > laser.warn;
        if (act) laser.ang += laser.d;
        if (laser.t > laser.warn + laser.act) laser = null;
        else if (act && player.invuln <= 0 && !(player.hurtCd > 0)) {
            const px = player.x - laser.ox, py = player.y - laser.oy;
            for (let k = 0; k < laser.arms; k++) {   // 回転するレーザー（arms本）
                const a = laser.ang + k * 2 * Math.PI / laser.arms, dx = Math.cos(a), dy = Math.sin(a);

function drawShape(s, x, y, r, color, a) {
    ctx.globalAlpha = a; ctx.fillStyle = color; ctx.beginPath();
    if (s === 'moon') { // 三日月
        ctx.arc(x, y, r * 1.1, -Math.PI / 2, Math.PI / 2, true);
        ctx.quadraticCurveTo(x - r * 0.9, y, x, y - r * 1.1);
    } else {
        const T = { drop:[20,0], tri:[3,0], dia:[4,0], shuri:[8,1], rock:[6,0], bolt:[10,1], mirror:[8,0], gear:[12,1,0.8], penta:[5,0], cross:[8,1,0.5], flame:[14,1,0.45] }[s] || [4,0];
        const n = T[0], R = r * (s === 'tri' ? 1.15 : s === 'shuri' ? 1.25 : 1.1), dy = s === 'tri' ? r * 0.45 : 0;
        for (let i = 0; i < n; i++) {
            const rr = (T[1] && i % 2) ? R * (T[2] || 0.4) : R, ang = -Math.PI / 2 + i * 2 * Math.PI / n;
            const px = x + Math.cos(ang) * rr, py = y + dy + Math.sin(ang) * rr;
            i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
        }
        ctx.closePath();
    }
    ctx.fill(); ctx.globalAlpha = 1;
}

        bar(10, 28, 150, player.hp, maxHP());
        ctx.textAlign = "left"; ctx.font = "bold 13px sans-serif"; ctx.fillStyle = "white"; ctx.fillText("HP", 168, 41);
        if (ch.id === 'rai') { ctx.fillStyle = player.thunder > 0 ? "#fff06a" : player.thunderCd > 0 ? "#ffb347" : "#7be07b"; ctx.fillText(player.thunder > 0 ? `雷神 あと${Math.ceil(player.thunder / 60)}秒` : player.thunderCd > 0 ? `雷神 CT ${Math.ceil(player.thunderCd / 60)}秒` : "雷神化 OK", 200, 41); }
        if (ch.id === 'mira') { ctx.fillStyle = player.reflect > 0 ? "#d6c8ff" : player.reflectCd > 0 ? "#ffb347" : "#7be07b"; ctx.fillText(player.reflect > 0 ? "反射中" : player.reflectCd > 0 ? `反射 CT ${Math.ceil(player.reflectCd / 60)}秒` : "反射 OK", 200, 41); }
        if (ch.id === 'mint') { ctx.fillStyle = player.healCd > 0 ? "#ffb347" : "#7be07b"; ctx.fillText(player.healCd > 0 ? `回復 あと${Math.ceil(player.healCd / 60)}秒` : "回復 OK", 200, 41); }
        bar(640, 8, 150, pvp ? opp.hp : boss.hp, pvp ? oppCh.hp : boss.maxHp, "#ff6b8a");
        ctx.textAlign = "right"; ctx.fillText(pvp ? oppName : story ? bossCfg.name : `${BOSSES[bossLv].sub} Lv${bossLv + 1}`, 790, 38);
    }
    if (gameState === "playing" || gameState === "paused") drawHandIcon();
    if (gameState === "paused") drawPause();
    if (gameState === "clear") overlay(pvp ? "YOU WIN!!" : story ? `STAGE ${bossCfg.id} CLEAR!!` : "VICTORY!!", "#4eef90", pvp ? (netNote || `${oppName}に勝ちました！`) : (story ? storyClearText() : "精霊を鎮めました！おめでとう！"));
    else if (gameState === "gameover") overlay(pvp ? "YOU LOSE..." : "DEFEAT...", "#ff5555", pvp ? `${oppName}に負けました...` : "精霊の力に倒れてしまった...");
    if (story && !pvp && gameState === "clear" && rewardNote) { ctx.fillStyle = "#ffe97a"; ctx.font = "bold 22px sans-serif"; ctx.textAlign = "center"; ctx.fillText(rewardNote, 400, 340); }
    if (online && pvp && ratingNote && (gameState === "clear" || gameState === "gameover")) {
        ctx.fillStyle = "#ffe97a"; ctx.font = "bold 22px sans-serif"; ctx.textAlign = "center"; ctx.fillText(ratingNote, 400, 340);
    }
}

// --- 固定60fpsステップ（高リフレッシュレート画面でも速度が変わらない） ---
let last = performance.now(), acc = 0;
const STEP = 1000 / 60;
function loop(now) {
    const vis = gameState === "playing"; // スティックはプレイ中だけ表示
    if (vis !== stickVis) { stickVis = vis; stickEl.style.display = zoneEl.style.display = vis ? 'block' : 'none'; }
    pauseBtn.style.display = (vis && !pvp) ? 'block' : 'none';   // ポーズボタンはボス戦のプレイ中だけ
    leaveBtn.style.display = (vis && pvp && !online) ? 'block' : 'none';   // 退出ボタンは友達対戦のプレイ中だけ
    acc += Math.min(now - last, 100);
    last = now;
    while (acc >= STEP) { update(); acc -= STEP; }
    draw();
    requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
