<script>

// --- DOM更新は値が変わった時だけ（毎フレームの書き込みを排除） ---

}

// --- ゲーム状態 ---
let currentGesture = "No Hand";
let ammo = 30;
let shotCooldown = 0;
let bossShootCooldown = 0;
let gameState = "mode"; // "mode", "select", "bossSelect", "lobby", "playing", "clear", "gameover"
let pvp = false, online = false;        // true = 対人戦

const CHARS = [
 {id:'mint',name:'ミント',shape:'drop',color:'#7be07b',hp:90,speed:2.8,
  desc:['HP 90','移動 普通','グー/チョキ:弱い弾','パー:弾10でHP+25','(攻撃は控えめ)']},
 {id:'don',name:'ドン',shape:'tri',color:'#ff7a3d',hp:140,speed:2.2,

 {id:'hayate',name:'ハヤテ',shape:'dia',color:'#7fe8ff',hp:100,speed:3.2,
  desc:['HP 100','移動 速い','グー:ブーメラン','チョキ:風刃3連','パー:加速(約4秒)']},
 {id:'yomi',name:'ヨミ',shape:'shuri',color:'#b0a0ff',hp:110,speed:2.8,
  desc:['HP 110','移動 普通','グー/チョキ:手裏剣','パー:弾12で影分身','(同じ攻撃を真似る)']},
 {id:'luna',name:'ルナ',shape:'moon',color:'#ffe97a',hp:95,speed:2.6,
  desc:['HP 95','移動 やや遅い','グー長押し:溜め撃ち','チョキ:追尾月光','パー:弾10で流星群']}
];
CHARS.push(
 {id:'goro',name:'ゴロー',shape:'rock',color:'#b09070',hp:180,speed:2.0,
  desc:['HP 180','移動 とても遅い','グー:転がる岩','チョキ:小石散弾','パー:弾14で岩の壁']},
 {id:'rai',name:'ライ',shape:'bolt',color:'#fff06a',hp:100,speed:3.0,
  desc:['HP 100','移動 やや速い','グー:超高速の稲妻','チョキ:蛇行する稲妻','パー:弾12で落雷']},
 {id:'mira',name:'ミラ',shape:'mirror',color:'#d6c8ff',hp:105,speed:2.8,
  desc:['HP 105','移動 普通','グー:光線','チョキ:無敵ダッシュ','パー:反射バリア']}
);
let ch = CHARS[0], clones = [];  // 分身リスト（ヨミの影分身 / ゴローの岩の壁）

const BOSSES = [
 {sub:'コダマ',hp:500,size:40,color:'#7bd66b',pts:3,spiky:false,moveInt:70,moveSpd:4,chase:0,jump:-9,jumpP:0.4,shootInt:95,pattern:'single',
  desc:['HP 500','森の木霊','追尾弾を単発']},
 {sub:'ツムジ',hp:700,size:42,color:'#6bd6e6',pts:4,spiky:false,moveInt:45,moveSpd:6,chase:1.2,jump:-10,jumpP:0.6,shootInt:80,pattern:'fan3',
  desc:['HP 700','旋風の獣','3方向弾']},
 {sub:'ライジン',hp:950,size:46,color:'#ffd84e',pts:6,spiky:true,moveInt:35,moveSpd:7,chase:1.8,jump:-10.5,jumpP:0.7,shootInt:65,pattern:'storm',
  desc:['HP 950','雷神','5方向弾+高速追尾']},
 {sub:'オロチ',hp:1300,size:52,color:'#a066ff',pts:8,spiky:true,moveInt:28,moveSpd:8,chase:2.2,jump:-11,jumpP:0.8,shootInt:55,pattern:'chaos',
  desc:['HP 1300','八つ首の大蛇','全方位弾+追尾弾']}
];
let bossLv = 0, bossCfg = BOSSES[0];

let player = { x:100, y:350, w:30, h:30, vx:0, vy:0, speed:2.8, jumpPower:-9.5, isGround:false, hp:100 };
let boss = { x:650, y:340, w:40, h:40, vx:2.0, vy:0, jumpPower:-9.0, isGround:false, hp:500, maxHp:500, moveTimer:0 };

// 足場：床 + 3段 × 2列 × 左右 = 各陣営6枚（段差80px。platforms[0]は床）
const platforms = [{x:0,y:400,w:800,h:50}];
for (const y of [320, 240, 160]) {
    for (const x of [45, 240]) {
        platforms.push({x, y, w:115, h:15});
        platforms.push({x:800 - x - 115, y, w:115, h:15}); // ボス側は左右対称
    }
}

let bullets = [];
let bossBullets = [];
const keys = { left:false, right:false };

// 足場の上で↓：その足場をすり抜けて降りる（床では無効）
function dropDown() {
    if (gameState === "playing" && player.isGround && player.standing && player.standing !== platforms[0]) {
        player.dropPlat = player.standing; player.isGround = false; player.vy = 1;
    }
}
function jump() {
    if (gameState === "playing" && player.isGround) { player.vy = player.jumpPower; player.isGround = false; }
    else if (gameState === "bossSelect") resetGame();
}

window.addEventListener('keydown', e => {
    if (e.target && e.target.tagName === 'INPUT') return;   // ログイン欄などに入力中
    if ((e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A')) keys.left = true;
    if ((e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D')) keys.right = true;
    if ((e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W')) { e.preventDefault(); if (gameState === "playing") jump(); }
    if ((e.key === 'ArrowDown' || e.key === 's' || e.key === 'S')) { e.preventDefault(); dropDown(); }
    if ((e.key === 'r' || e.key === 'R') && (gameState === "clear" || gameState === "gameover")) resetGame();
    if ((e.key === 'Escape' || e.key === 'p' || e.key === 'P') && !pvp) {   // ポーズ / 再開
        if (gameState === "playing") { gameState = "paused"; stick.x = stick.y = 0; } else if (gameState === "paused") gameState = "playing";
    }
    if (gameState === "mode" && (e.key === 'h' || e.key === 'H')) { helpPage = 0; gameState = "help"; }
    if ((gameState === "help" || gameState === "ranking") && e.key === 'Escape') gameState = "mode";
    if (gameState === "mode" && /^[123]$/.test(e.key)) pickMode(+e.key - 1);
    else if (gameState === "select" && /^[1-9]$/.test(e.key)) chooseChar(+e.key - 1);
    else if (gameState === "bossSelect" && /^[1-4]$/.test(e.key)) startGame(+e.key - 1);
    if (gameState === "bossSelect" && e.key === 'Escape') resetGame();
});
window.addEventListener('blur', () => { keys.left = keys.right = false; });
window.addEventListener('keyup', e => {
    if ((e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A')) keys.left = false;
    if ((e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D')) keys.right = false;
});
// --- 入力：画面スティック / ゲームパッド（十字キー・左スティック）---
// 倒した向きに移動。真横から45度以上（上/下に）倒すとジャンプ/降りる。
const stick = { x:0, y:0 }, stickEl = document.getElementById('stick');
let stickVis = false, dropLatch = false;
const zoneEl = document.getElementById('stickZone'), pauseBtn = document.getElementById('pauseBtn');
pauseBtn.addEventListener('click', () => { if (gameState === "playing" && !pvp) { gameState = "paused"; stick.x = stick.y = 0; } });
(() => {
    const knob = document.getElementById('knob'), R = 62, HALF = 85;
    let pid = null;
    const move = e => {
        const r = stickEl.getBoundingClientRect();
        let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
        const d = Math.hypot(dx, dy); if (d > R) { dx *= R / d; dy *= R / d; }
        stick.x = dx / R; stick.y = dy / R;
        knob.style.transform = `translate(${dx}px,${dy}px)`;
    };
    const place = e => { // 触った場所にスティックを出す（画面のどこでもOK）
        const cx = Math.max(HALF + 8, Math.min(innerWidth - HALF - 8, e.clientX));
        const cy = Math.max(HALF + 8, Math.min(innerHeight - HALF - 8, e.clientY));
        stickEl.style.left = (cx - HALF) + 'px'; stickEl.style.top = (cy - HALF) + 'px'; stickEl.style.bottom = 'auto';
    };
    const end = e => {
        if (e.pointerId !== pid) return;
        pid = null; stick.x = stick.y = 0; knob.style.transform = '';
        stickEl.style.left = stickEl.style.top = stickEl.style.bottom = '';   // 初期位置へ戻る
    };
    zoneEl.addEventListener('pointerdown', e => { e.preventDefault(); if (pid !== null) return; pid = e.pointerId; try { zoneEl.setPointerCapture(pid); } catch (_) {} place(e); move(e); });
    zoneEl.addEventListener('pointermove', e => { if (e.pointerId === pid) move(e); });
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => zoneEl.addEventListener(t, end));
    zoneEl.addEventListener('contextmenu', e => e.preventDefault());
})();
function pollInput() {
    let px = 0, py = 0;
    const gp = navigator.getGamepads ? [...navigator.getGamepads()].find(g => g && g.connected) : null;
    if (gp) {
        px = gp.axes[0] || 0; py = gp.axes[1] || 0;
        const B = i => gp.buttons[i] && gp.buttons[i].pressed;
        if (B(14)) px = -1; if (B(15)) px = 1; if (B(12)) py = -1; if (B(13)) py = 1;
    }
    const sx = Math.abs(stick.x) >= Math.abs(px) ? stick.x : px;
    const sy = Math.abs(stick.y) >= Math.abs(py) ? stick.y : py;
    const steep = Math.hypot(sx, sy) >= 0.5 && Math.abs(sy) >= Math.abs(sx); // 45度以上
    if (steep && sy < 0) jump();                                          // 上：ジャンプ（着地中のみ）
    if (steep && sy > 0) dropDown();                                      // 下：降りる（倒し続けると着地のたびに次の足場も降りる）
    return { left: sx < -0.25, right: sx > 0.25 };
}

function resetGame() { // ボス戦→キャラ選択へ / 対人戦→モード選択へ
    bullets = []; bossBullets = []; clones = [];
    if (pvp) { closeNet(); pvp = false; gameState = "mode"; } else gameState = "select";
}
function chooseChar(i) {
    if (!CHARS[i]) return;
    ch = CHARS[i];
    if (pvp) { gameState = "lobby"; showLobby(true); if (online) { matching = true; matchStart = Date.now(); settled = false; findMatch(); } } else gameState = "bossSelect";
}
function startGame(lv) {
    bossLv = lv; bossCfg = BOSSES[lv];
    Object.assign(player, { x:100, y:350, vx:0, vy:0, hp:ch.hp, speed:ch.speed, dropPlat:null, standing:null, invuln:0, reflect:0, charge:0, haste:0 });
    Object.assign(boss, { x:650, y:340, vx:2.0, vy:0, w:bossCfg.size, h:bossCfg.size, hp:bossCfg.hp,
                          maxHp:bossCfg.hp, jumpPower:bossCfg.jump, moveTimer:0, atk:0, dropPlat:null, standing:null });
    bullets = []; bossBullets = []; clones = [];
    ammo = 30; shotCooldown = 0; bossShootCooldown = 0; currentGesture = "No Hand";
    gameState = "playing";
}
canvasElement.addEventListener('pointerdown', e => {
    window.focus();
    if (gameState === "paused") {   // ポーズ画面：再開 / キャラ選択へ
        const r1 = canvasElement.getBoundingClientRect();
        const px = (e.clientX - r1.left) * 800 / r1.width, py = (e.clientY - r1.top) * 450 / r1.height;
        if (px > 250 && px < 550) { if (py > 200 && py < 252) gameState = "playing"; else if (py > 270 && py < 322) resetGame(); }
        return;
    }
    if (gameState === "clear" || gameState === "gameover") { resetGame(); return; }
    if (gameState === "mode") {
        const r0 = canvasElement.getBoundingClientRect();
        const mx = (e.clientX - r0.left) * 800 / r0.width, my = (e.clientY - r0.top) * 450 / r0.height;
        if (my > 375) {   // 下のボタン：ランキング / あそびかた / ログイン
            if (mx < 265) openRanking(); else if (mx < 515) { helpPage = 0; gameState = "help"; } else showAuth();
            return;
        }
        const idx = mx < 271 ? 0 : mx < 529 ? 1 : 2;
        pickMode(idx); return;
    }
    if (gameState === "ranking") { gameState = "mode"; return; }
    if (gameState === "help") { if (++helpPage >= HELP.length) gameState = "mode"; return; }
    if (gameState !== "select" && gameState !== "bossSelect") return;
    const r = canvasElement.getBoundingClientRect();
    const x = (e.clientX - r.left) * 800 / r.width, y = (e.clientY - r.top) * 450 / r.height;
    const sel = gameState === "select", list = sel ? CHARS : BOSSES;
    list.forEach((c, i) => {
        const cx = sel ? 15 + (i % 4) * 195 : 30 + i * 190, cy = sel ? 62 + ((i / 4) | 0) * 178 : 95;
        const cw = sel ? 185 : 170, chh = sel ? 170 : 305;
        if (x >= cx && x <= cx + cw && y >= cy && y <= cy + chh) sel ? chooseChar(i) : startGame(i);
    });
    if (x < 150 && y > 410) { if (gameState === "bossSelect") resetGame(); else if (gameState === "select") gameState = "mode"; }
});

// --- MediaPipe Hands（軽量設定） ---
const hands = new Hands({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
hands.setOptions({
    maxNumHands: 1,
    modelComplexity: 0,          // 1 → 0 : 精度は少し下がるが大幅に軽い
    minDetectionConfidence: 0.6,
    minTrackingConfidence: 0.5
});

// ジェスチャーの安定化（2回連続で同じ結果なら確定 → ちらつき防止）
let pendingGesture = "No Hand", pendingCount = 0;
function commitGesture(g) {
    if (g === pendingGesture) pendingCount++; else { pendingGesture = g; pendingCount = 1; }
    if (pendingCount >= 2 && g !== currentGesture) {
        currentGesture = g;
        setText(statusEl, `Gesture: ${g}`);
    }
}

hands.onResults(results => {
    let g = "No Hand";
    const lms = results.multiHandLandmarks;
    if (lms && lms.length > 0) {
        const lm = lms[0];
        const iOpen = lm[8].y < lm[6].y;
        const mOpen = lm[12].y < lm[10].y;
        const rOpen = lm[16].y < lm[14].y;
        const pOpen = lm[20].y < lm[18].y;
        if (!iOpen && !mOpen && !rOpen && !pOpen) g = "Rock";
        else if (iOpen && mOpen && !rOpen && !pOpen) g = "Scissors";
        else if (iOpen && mOpen && rOpen && pOpen) g = "Paper";
        else g = "Unknown";
    }
    commitGesture(g);
});

// --- カメラ：低解像度 + 推論中は次フレームを送らない（処理の溜まりを防ぐ） ---
const DETECT_INTERVAL = 66;  // 約15回/秒
let busy = false, lastDetect = 0;

async function detectLoop(now) {
    scheduleNext();
    if (busy || document.hidden || gameState !== "playing") return;
    if (now - lastDetect < DETECT_INTERVAL) return;
    if (videoElement.readyState < 2) return;
    busy = true; lastDetect = now;
    try { await hands.send({ image: videoElement }); } catch (e) {}
    busy = false;
}
function scheduleNext() {
    if ('requestVideoFrameCallback' in videoElement) videoElement.requestVideoFrameCallback(detectLoop);
    else requestAnimationFrame(detectLoop);
}

navigator.mediaDevices.getUserMedia({
    video: { width: { ideal: 320 }, height: { ideal: 240 }, frameRate: { ideal: 20, max: 30 }, facingMode: 'user' },
    audio: false
}).then(stream => {
    videoElement.srcObject = stream;
    return videoElement.play();
}).then(() => {
    setText(statusEl, "Active: Show Hand");
    scheduleNext();
}).catch(() => setText(statusEl, "カメラを使用できません"));

// --- 対人戦（PeerJS / WebRTC）---
// 各端末は「自分=左側」で動かし、相手は左右反転して表示する。ダメージ判定は被弾する側が行う。
let peer = null, conn = null, sentHello = false, netNote = "", tick = 0, bid = 0, dead = new Set();
let oppCh = CHARS[0], opp = { x:100, y:350, hp:100, inv:0, rf:0, c:[], b:[] };
const lobbyEl = document.getElementById('lobby'), lobbyMsgEl = document.getElementById('lobbyMsg');

    for (const id of ['rowHost', 'rowJoin']) document.getElementById(id).style.display = online ? 'none' : '';
    if (on) lobbyMsg(online ? '対戦相手を探しています…' : 'ルームを作る か、相手のコードを入力');

function elo(win, opp) { const ex = 1 / (1 + Math.pow(10, (opp - rating) / 400)); return Math.max(100, Math.round(rating + 32 * ((win ? 1 : 0) - ex))); }
function settleLocal(win) {   // サーバーなし：この端末だけで計算（イロレーティング）

}

    } catch (e) { ratingNote = '結果の送信に失敗しました'; }
}

// --- オンライン対戦（レートの近い相手を探す）---
// レートを150刻みの「帯」に分け、帯ごとに待ち合わせID(QUEUE)を用意。同じ帯→隣の帯…と、時間がたつほど探す範囲を広げる
const bucketOf = r => Math.floor(r / 150), queueId = b => 'spiritarena-queue-r' + b;
let matchStart = 0;
function matchRetry(ms) { if (!matching) return; clearTimeout(matchTimer); matchTimer = setTimeout(findMatch, ms || 600 + Math.random() * 1200); }
function watchdog() { setTimeout(() => { if (matching && gameState === "lobby") findMatch(); }, 12000); }   // つながらなければ探し直す
function candidates() {
    const el = Date.now() - matchStart, range = el < 15000 ? 0 : el < 35000 ? 1 : el < 60000 ? 2 : 10;   // 15秒/35秒/60秒で範囲を広げる
    const b = bucketOf(rating), list = [b];
    for (let d = 1; d <= range; d++) list.push(b - d, b + d);   // 近い帯から順に
    return list.filter(x => x >= 0);
}
function findMatch() {
    if (!matching) return;
    if (typeof Peer === 'undefined') return lobbyMsg('通信ライブラリを読み込めません（ネット接続を確認）');
    resetPeer();
    isHost = false; matchId = null;
    lobbyMsg(`対戦相手を探しています…\nあなたのレート: ${rating}`);
    const list = candidates(), me = peer = new Peer(), st = { done:false, i:0 };
    const seek = i => {
        if (!matching) return;
        if (i >= list.length) return becomeWaiter();           // 誰も待っていない → 自分が待機役になる
        st.i = i;
        const q = me.connect(queueId(list[i]));
        q.on('data', m => { if (m.t === 'room' && !st.done) { st.done = true; setupConn(me.connect(m.id)); q.close(); watchdog(); } });
        q.on('close', () => { if (!st.done && st.i === i) matchRetry(); });
    };
    me.on('open', () => seek(0));
    me.on('error', e => { if (st.done) return; if (e.type === 'peer-unavailable') seek(st.i + 1); else matchRetry(1500); });
}
function becomeWaiter() {
    resetPeer();
    lobbyMsg(`対戦相手を待っています…\nあなたのレート: ${rating}`);
    const qp = qpeer = new Peer(queueId(bucketOf(rating)));
    let taken = false;
    qp.on('error', e => matchRetry(e.type === 'unavailable-id' ? 700 : 1500));   // 先に取られた → 探す側に戻る
    qp.on('open', () => {   // 待ち続けず、一定時間で探す範囲を広げて探し直す
        clearTimeout(matchTimer);
        matchTimer = setTimeout(() => { if (matching && gameState === "lobby" && !taken) findMatch(); }, 9000 + Math.random() * 4000);
    });
    qp.on('connection', c => {
        if (taken) { c.on('open', () => c.close()); return; }
        taken = true;
        isHost = true; matchId = 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);   // 試合ID（待機役が決める）
        const room = 'spiritarena-' + Math.random().toString(36).slice(2, 8);
        const host = peer = new Peer(room);
        host.on('connection', setupConn);
        host.on('error', () => { taken = false; matchRetry(1000); });
        host.on('open', () => {
            const send = () => { c.send({ t:'room', id:room }); setTimeout(() => { try { qp.destroy(); } catch (e) {} if (qpeer === qp) qpeer = null; }, 1500); };
            c.open ? send() : c.on('open', send);
            watchdog();
        });
    });
}
function sayHello() { if (conn && conn.open && !sentHello) { sentHello = true; conn.send({ t:'hello', ch:ch.id, r:rating, uid:user ? user.id : null, mid:matchId }); } }
function setupConn(c) {
    conn = c;
    c.on('open', sayHello);
    c.on('data', onData);
    c.on('close', () => {
        if (gameState === "playing") { netNote = "相手が切断しました"; gameState = "clear"; }
        else if (gameState === "lobby") { lobbyMsg('切断されました'); if (matching) matchRetry(); }
    });
}
function hostRoom() {
    if (typeof Peer === 'undefined') return lobbyMsg('通信ライブラリを読み込めません（ネット接続を確認）');
    resetPeer();
    const code = String(1000 + Math.floor(Math.random() * 9000));

}
function joinRoom() {

}

function startPvp() {
    matching = false; clearTimeout(matchTimer);
    settled = false; ratingNote = "";

    showLobby(false);
    Object.assign(player, { x:100, y:350, vx:0, vy:0, hp:ch.hp, speed:ch.speed, dropPlat:null, standing:null, invuln:0, reflect:0, charge:0, haste:0 });
    Object.assign(boss, { x:700, y:350, w:30, h:30, vx:0, vy:0 });
    bullets = []; bossBullets = []; clones = []; dead = new Set();
    opp = { x:100, y:350, hp:oppCh.hp, inv:0, rf:0, c:[], b:[] };
    ammo = 30; shotCooldown = 0; currentGesture = "No Hand"; netNote = "";
    gameState = "playing";
}

function onData(m) {
    if (m.t === 'hello') {
        oppCh = CHARS.find(c => c.id === m.ch) || CHARS[0]; oppRating = m.r || 1000; oppUid = m.uid || null; if (m.mid && !isHost) matchId = m.mid;
        sayHello();
        if (gameState === "lobby") startPvp();
    } else if (m.t === 's' && gameState === "playing") {
        opp = m; boss.x = 800 - m.x; boss.y = m.y;
        if (m.hp <= 0) { gameState = "clear"; return; }   // 相手のHPが0 = 勝ち
        processOppBullets();
    } else if (m.t === 'k') {                              // 自分の弾が当たった/消された
        const i = bullets.findIndex(b => b.id === m.id);
        if (i >= 0) bullets.splice(i, 1);
    }
}

function sendState(force) {
    if (!conn || !conn.open) return;
    if (!force && (tick++ & 1)) return;                    // 約30回/秒
    for (const b of bullets) if (b.id === undefined) b.id = ++bid;
    conn.send({ t:'s', x:player.x, y:player.y, hp:player.hp, inv:(player.haste > 0 || player.invuln > 0) ? 1 : 0, rf:player.charge | 0, rv:player.reflect > 0 ? 1 : 0,
                c: clones.map(c => [c.x, c.y, c.guard ? 1 : 0, c.hits]),
                b: bullets.map(b => [b.id, b.x, b.y, b.power, b.type]) });
}

// 相手の弾 → 分身 / 反射バリア / 自分 の順に当たり判定
function processOppBullets() {
    for (const [id, bx0, by, power] of opp.b) {
        if (dead.has(id)) continue;
        const bx = 800 - bx0;
        let used = false;
        for (let k = clones.length - 1; k >= 0; k--) {
            const c = clones[k];
            if (Math.abs(bx - c.x) < 20 && Math.abs(by - c.y) < 20) { if (--c.hits <= 0) clones.splice(k, 1); used = true; break; }
        }
        if (!used && player.reflect > 0 && Math.hypot(bx - player.x, by - player.y) < 40) {
            bullets.push({x:bx, y:by, vx:0, vy:0, power:18, type:'blaze', life:300, homing:true, spd:6});
            used = true;
        }
        if (!used && player.invuln <= 0 && Math.abs(bx - player.x) < 20 && Math.abs(by - player.y) < 20) {
            player.hp = Math.max(0, player.hp - power); used = true;
        }
        if (used) { dead.add(id); conn.send({ t:'k', id }); }
    }
    if (player.hp <= 0) { gameState = "gameover"; sendState(true); }
}

// --- キャラ別の攻撃 ---
function attack() {
    const x = player.x, y = player.y, g = currentGesture, n0 = bullets.length;
    const F = o => bullets.push(Object.assign({ x, y, vy:0, life:140 }, o));
    if (ch.id === 'luna') { // ルナ：グー長押しでチャージ → 離すと発射
        if (g === "Rock") { if (ammo >= 3 && player.charge < 90) player.charge++; }
        else if (player.charge > 0) {
            if (player.charge >= 15 && ammo >= 3) { F({ vx:8, power:Math.round(15 + player.charge * 0.8), type:'moon' }); ammo -= 3; shotCooldown = 20; }
            player.charge = 0;
        }
    }
    if (shotCooldown > 0) return;
    switch (ch.id) {
    case 'mint': // 癒し手：攻撃は弱め、パーで回復
        if (g === "Rock" && ammo >= 1) { F({ vx:7, power:12, type:'seed' }); ammo -= 1; shotCooldown = 28; }
        else if (g === "Scissors" && ammo >= 2) {
            for (const d of [-1, 1]) F({ y:y + d * 10, vx:5.5, baseYo:y + d * 10, angle:d > 0 ? 0 : Math.PI, power:8, type:'leaf' });
            ammo -= 2; shotCooldown = 26;
        } else if (g === "Paper" && ammo >= 10 && player.hp < ch.hp) { player.hp = Math.min(ch.hp, player.hp + 25); ammo -= 10; shotCooldown = 90; }
        break;
    case 'don': // 鬼：放物線の爆弾
        if (g === "Rock" && ammo >= 3) { F({ vx:8, vy:-5.5, grav:0.2, power:42, type:'bomb' }); ammo -= 3; shotCooldown = 55; }
        else if (g === "Scissors" && ammo >= 4) { F({ vx:6, power:6, type:'bomb', explode:30, life:60 }); ammo -= 4; shotCooldown = 50; }
        else if (g === "Paper" && ammo >= 8) { for (const vx of [6, 7.5, 9]) F({ vx, vy:-5.5, grav:0.2, power:30, type:'bomb' }); ammo -= 8; shotCooldown = 70; }
        break;
    case 'hayate': // 風：ブーメランと加速
        if (g === "Rock" && ammo >= 1) { F({ vx:8, power:18, type:'boom', boom:true, pierce:true, life:170 }); ammo -= 1; shotCooldown = 38; }
        else if (g === "Scissors" && ammo >= 3) {
            for (const d of [-0.12, 0, 0.12]) F({ vx:Math.cos(d) * 10, vy:Math.sin(d) * 10, power:8, type:'wind', life:100 });
            ammo -= 3; shotCooldown = 24;
        } else if (g === "Paper" && ammo >= 6 && player.haste <= 0) { player.haste = 240; ammo -= 6; shotCooldown = 20; }
        break;
    case 'yomi': // 忍：手裏剣と、同じ攻撃を真似る影分身
        if (g === "Rock" && ammo >= 1) { F({ vx:10, power:15, type:'shuri' }); ammo -= 1; shotCooldown = 24; }
        else if (g === "Scissors" && ammo >= 3) {
            for (const d of [-0.2, 0, 0.2]) F({ vx:Math.cos(d) * 8.5, vy:Math.sin(d) * 8.5, power:8, type:'shuri' });
            ammo -= 3; shotCooldown = 30;
        } else if (g === "Paper" && ammo >= 12 && placeClone()) { ammo -= 12; shotCooldown = 40; }
        if (clones.length && bullets.length > n0) { // 影分身も同じ弾を撃つ
            const c = clones[0];
            for (const b of bullets.slice(n0)) bullets.push(Object.assign({}, b, { x:c.x, y:b.y - y + c.y }));
        }
        break;
    case 'goro': // 岩：遅くて硬い。岩の壁が身代わりになる
        if (g === "Rock" && ammo >= 2) { F({ vx:4.5, power:32, type:'boulder', life:200 }); ammo -= 2; shotCooldown = 45; }
        else if (g === "Scissors" && ammo >= 3) {
            for (let k = -2; k <= 2; k++) F({ vx:7 + Math.abs(k) * 0.3, vy:k * 0.9, power:8, type:'pebble', life:35 });
            ammo -= 3; shotCooldown = 34;
        } else if (g === "Paper" && ammo >= 14 && placeClone()) { ammo -= 14; shotCooldown = 60; }
        break;
    case 'rai': // 雷：高速弾と、相手の位置に落ちる落雷
        if (g === "Rock" && ammo >= 1) { F({ vx:14, power:14, type:'bolt', life:70 }); ammo -= 1; shotCooldown = 18; }
        else if (g === "Scissors" && ammo >= 2) {
            for (const d of [-1, 1]) F({ y:y + d * 10, vx:9, baseYo:y + d * 10, angle:d > 0 ? 0 : Math.PI, power:11, type:'zig', life:100 });
            ammo -= 2; shotCooldown = 26;
        } else if (g === "Paper" && ammo >= 12) {
            bullets.push({ x:boss.x, y:-10, vx:0, vy:14, power:45, type:'bolt', delay:35, life:140 });
            ammo -= 12; shotCooldown = 80;
        }
        break;
    case 'mira': // 鏡：光線・無敵ダッシュ・反射バリア
        if (g === "Rock" && ammo >= 2) { F({ vx:12, power:22, type:'ray', life:80 }); ammo -= 2; shotCooldown = 30; }
        else if (g === "Scissors" && ammo >= 3) {
            player.x = Math.max(15, Math.min(385, x + (keys.left ? -90 : 90))); player.invuln = 25; ammo -= 3; shotCooldown = 50;
        } else if (g === "Paper" && ammo >= 8) { player.reflect = 80; ammo -= 8; shotCooldown = 100; }
        break;
    case 'luna': // 月：追尾月光と流星群
        if (g === "Scissors" && ammo >= 3) {
            for (const d of [-1, 1]) F({ y:y + d * 10, vx:0, power:7, type:'moon', homing:true, spd:5, life:300 });
            ammo -= 3; shotCooldown = 34;
        } else if (g === "Paper" && ammo >= 10) {
            for (let k = -2; k <= 2; k++) bullets.push({ x:boss.x + k * 38, y:-10, vx:0, vy:5, power:13, type:'meteor', life:140 });
            ammo -= 10; shotCooldown = 60;
        }
        break;
    }
}

// --- 更新処理 ---
function update() {
    if (gameState !== "playing") return;
    const gravity = 0.45;

    const sp = player.speed * (player.haste > 0 ? 1.6 : 1);
    const inp = pollInput();
    player.vx = 0;
    if (keys.left || inp.left) player.vx = -sp;
    if (keys.right || inp.right) player.vx = sp;
    player.vy += gravity;
    player.x += player.vx;
    player.y += player.vy;
    if (player.x < 15) player.x = 15;
    if (player.x > 385) player.x = 385;

    if (!pvp) {
    boss.moveTimer++;
    if (boss.moveTimer > bossCfg.moveInt) {
        // chase>0 のボスは中央（プレイヤー側）へ寄りやすく、プレイヤーが高所にいると飛び上がる
        boss.vx = (Math.random() - 0.5) * bossCfg.moveSpd - bossCfg.chase;
        // 足場の上にいるときは、プレイヤーが下にいるほど降りやすい
        const canDrop = boss.isGround && boss.standing && boss.standing !== platforms[0];
        if (canDrop && Math.random() < (player.y > boss.y + 60 ? 0.6 : 0.2)) {
            boss.dropPlat = boss.standing; boss.isGround = false; boss.vy = 1;
        } else if ((Math.random() < bossCfg.jumpP || (bossCfg.chase && player.y < boss.y - 60)) && boss.isGround) {
            boss.vy = boss.jumpPower; boss.isGround = false;
        }
        boss.moveTimer = 0;
    }
    boss.vy += gravity;
    boss.x += boss.vx;
    boss.y += boss.vy;
    if (boss.x < 415) { boss.x = 415; boss.vx *= -1; }
    if (boss.x > 785) { boss.x = 785; boss.vx *= -1; }
    }

    player.isGround = false;
    boss.isGround = false;
    for (const p of platforms) {
        const pBottom = player.y + player.h/2, pPrev = pBottom - player.vy;
        if (p === player.dropPlat && pBottom > p.y + 20) player.dropPlat = null; // 十分降りたら解除
        if (p !== player.dropPlat && player.x + player.w/2 > p.x && player.x - player.w/2 < p.x + p.w &&
            pBottom >= p.y && pPrev <= p.y + 5 && player.vy >= 0) {
            player.y = p.y - player.h/2; player.vy = 0; player.isGround = true; player.standing = p;
        }
        const bBottom = boss.y + boss.h/2, bPrev = bBottom - boss.vy;
        if (p === boss.dropPlat && bBottom > p.y + 20) boss.dropPlat = null;
        if (!pvp && p !== boss.dropPlat && boss.x + boss.w/2 > p.x && boss.x - boss.w/2 < p.x + p.w &&
            bBottom >= p.y && bPrev <= p.y + 5 && boss.vy >= 0) {
            boss.y = p.y - boss.h/2; boss.vy = 0; boss.isGround = true; boss.standing = p;
        }
    }

    // 分身の更新（重力・着地・砲台の攻撃）
    for (const c of clones) {
        c.vy += gravity; c.y += c.vy;
        const cb = c.y + 15, cp = cb - c.vy;
        for (const p of (c.floorOnly ? [platforms[0]] : platforms)) {
            if (c.x + 15 > p.x && c.x - 15 < p.x + p.w && cb >= p.y && cp <= p.y + 5 && c.vy >= 0) {
                c.y = p.y - 15; c.vy = 0;
            }
        }
        if (c.turret && ++c.t >= 100) {
            c.t = 0;
            bullets.push({x:c.x, y:c.y, vx:7.0, vy:0, power:22, type:'rock', life:140});
        }
    }

    // ボスの攻撃
    if (!pvp) {
    if (++bossShootCooldown > bossCfg.shootInt) { bossShoot(); bossShootCooldown = 0; }
    for (let i = bossBullets.length - 1; i >= 0; i--) {
        const bb = bossBullets[i];
        bb.life--;
        const t = clones.find(c => c.guard) || player; // 盾の分身があれば狙う
        if (bb.turn && Math.hypot(t.x - bb.x, t.y - bb.y) < 130) bb.turn = 0; // 当たる少し前で追尾をやめ、以降は直進
        let diff = Math.atan2(t.y - bb.y, t.x - bb.x) - bb.angle;
        while (diff < -Math.PI) diff += Math.PI*2;
        while (diff > Math.PI) diff -= Math.PI*2;
        bb.angle += diff * bb.turn;
        bb.x += Math.cos(bb.angle) * bb.speed;
        bb.y += Math.sin(bb.angle) * bb.speed;

        if (hitClone(bb)) { bossBullets.splice(i, 1); continue; } // 分身に当たった弾は消える
        if (player.reflect > 0 && Math.hypot(bb.x - player.x, bb.y - player.y) < 40) {
            bullets.push({x:bb.x, y:bb.y, vx:0, vy:0, power:18, type:'blaze', life:300, homing:true, spd:6});
            bossBullets.splice(i, 1);
            continue;
        }
        if (player.invuln <= 0 && Math.abs(bb.x - player.x) < 20 && Math.abs(bb.y - player.y) < 20) {
            player.hp -= 15;
            bossBullets.splice(i, 1);
            if (player.hp <= 0) { player.hp = 0; gameState = "gameover"; }
            continue;
        }
        if (bb.life <= 0 || bb.x < 0 || bb.x > 800 || bb.y < 0 || bb.y > 450) bossBullets.splice(i, 1);
    }
    }

    // プレイヤーの攻撃 & 弾薬回復
    if (shotCooldown > 0) shotCooldown--;
    if (player.haste > 0) player.haste--;
    if (player.invuln > 0) player.invuln--;
    if (player.reflect > 0) player.reflect--;
    if (currentGesture === "No Hand" && Math.random() < 0.25 && ammo < 30) ammo++;
    attack();

    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        if (b.delay > 0) { b.delay--; continue; } // 落雷の予備動作
        if (b.explode && --b.explode <= 0) { // 時限爆弾：扇状に破片を飛ばす
            for (let k = -3; k <= 3; k++) { const a = k * 0.28; bullets.push({x:b.x, y:b.y, vx:Math.cos(a) * 6, vy:Math.sin(a) * 6, power:11, type:'frag', life:50}); }
            bullets.splice(i, 1); continue;
        }
        if (b.homing) {
            const a = Math.atan2(boss.y - b.y, boss.x - b.x);
            b.x += Math.cos(a) * b.spd; b.y += Math.sin(a) * b.spd;
        } else {
            if (b.boom) { b.vx -= 0.07; if (b.vx < 0 && !b.back) { b.back = true; b.hit = false; } } // ブーメランは戻ってくる
            b.x += b.vx;
            if (b.baseYo !== undefined) { b.angle += 0.12; b.y = b.baseYo + Math.sin(b.angle) * 35; }
            else { b.y += b.vy; if (b.grav) b.vy += b.grav; }
        }
        b.life--;

        if (!pvp && b.x > boss.x - boss.w/2 && b.x < boss.x + boss.w/2 &&
            b.y > boss.y - boss.h/2 && b.y < boss.y + boss.h/2) {
            if (!b.hit) { // 貫通弾は1発につき1回だけダメージ
                boss.hp -= b.power; b.hit = true;
                if (boss.hp <= 0) { boss.hp = 0; gameState = "clear"; }
            }
            if (!b.pierce) bullets.splice(i, 1);
            continue;
        }
        if ((b.homing && b.life <= 0) || b.x > 800 || b.x < -20 || b.y > 450 || b.y < -100) bullets.splice(i, 1);
    }

    if (pvp) sendState();
    setText(pHpEl, `HP: ${player.hp}`);
    setText(bHpEl, pvp ? `相手 HP: ${opp.hp}` : `精霊 Lv${bossLv + 1} HP: ${boss.hp}`);
    setText(ammoEl, `マナ: ${ammo}`);
}

// ボスの攻撃パターン
function bossShoot() {
    const a = Math.atan2(player.y - boss.y, player.x - boss.x);
    const mk = (ang, sp, turn) => bossBullets.push({ x:boss.x, y:boss.y, speed:sp, angle:ang, life:300, turn:0 }); // 追尾なし：発射時にプレイヤーへ向け、あとは直進
    const n = ++boss.atk;
    switch (bossCfg.pattern) {
        case 'single': mk(a, 2.8, 0.02); break; // Lv1：追尾を弱く（旋回 0.05 → 0.02）
        case 'fan3': for (const d of [-0.3, 0, 0.3]) mk(a + d, 3.0, 0.02); break;
        case 'storm':
            if (n % 2) for (let d = -2; d <= 2; d++) mk(a + d * 0.25, 3.2, 0);
            else [3.6, 4.2, 4.8].forEach(sp => mk(a, sp, 0.04));
            break;
        case 'chaos':
            if (n % 2) { for (let k = 0; k < 12; k++) mk(k * Math.PI / 6 + n * 0.2, 2.4, 0); mk(a, 3.4, 0.05); }
            else [-0.15, 0, 0.15].forEach(d => mk(a + d, 4.2, 0.03));
            break;
    }
}

function drawBossShape(c, x, y, w) {
    const r = w * 0.6, m = c.spiky ? c.pts * 2 : c.pts, p = [];
    for (let i = 0; i < m; i++) {
        const rr = c.spiky && i % 2 ? r * 0.5 : r, ang = -Math.PI / 2 + i * 2 * Math.PI / m;
        p.push([Math.cos(ang) * rr, Math.sin(ang) * rr]);
    }
    const off = w / 2 - Math.max(...p.map(q => q[1])); // 足元をヒットボックス下端に合わせる
    ctx.fillStyle = c.color; ctx.beginPath();
    p.forEach((q, i) => i ? ctx.lineTo(x + q[0], y + q[1] + off) : ctx.moveTo(x + q[0], y + q[1] + off));
    ctx.closePath(); ctx.fill();
}

// ボスの弾が分身に当たったら耐久を減らし、0で壊れる（砲台は1発・盾は2発）
function hitClone(bb) {
    for (let k = clones.length - 1; k >= 0; k--) {
        const c = clones[k];
        if (Math.abs(bb.x - c.x) < 20 && Math.abs(bb.y - c.y) < 20) {
            if (--c.hits <= 0) clones.splice(k, 1);
            return true;
        }
    }
    return false;
}

}

function placeClone() {
    const guard = ch.id === 'goro';
    clones = [{ x: Math.max(15, Math.min(385, player.x + (guard ? 45 : 40))), y: player.y, vy: 0, guard, turret: false,
                hits: guard ? 3 : 1, floorOnly: !player.isGround, t: 0 }];
    return true;
}

function drawShape(s, x, y, r, color, a) {
    ctx.globalAlpha = a; ctx.fillStyle = color; ctx.beginPath();
    if (s === 'moon') { // 三日月
        ctx.arc(x, y, r * 1.1, -Math.PI / 2, Math.PI / 2, true);
        ctx.quadraticCurveTo(x - r * 0.9, y, x, y - r * 1.1);
    } else {
        const T = { drop:[20,0], tri:[3,0], dia:[4,0], shuri:[8,1], rock:[6,0], bolt:[10,1], mirror:[8,0] }[s] || [4,0];
        const n = T[0], R = r * (s === 'tri' ? 1.15 : s === 'shuri' ? 1.25 : 1.1), dy = s === 'tri' ? r * 0.45 : 0;
        for (let i = 0; i < n; i++) {
            const rr = (T[1] && i % 2) ? R * 0.4 : R, ang = -Math.PI / 2 + i * 2 * Math.PI / n;
            const px = x + Math.cos(ang) * rr, py = y + dy + Math.sin(ang) * rr;
            i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
        }
        ctx.closePath();
    }
    ctx.fill(); ctx.globalAlpha = 1;
}

function draw() {
    ctx.clearRect(0, 0, 800, 450);
    drawBG(performance.now());
    if (gameState === "ranking") { drawRanking(); return; }
    if (gameState === "help") { drawHelp(); return; }
    if (gameState === "mode") { drawMode(); return; }
    if (gameState === "lobby") return;
    if (gameState === "select") { drawSelect(); return; }
    if (gameState === "bossSelect") { drawBossSelect(); return; }

    ctx.strokeStyle = '#3d5a46'; ctx.lineWidth = 2; ctx.setLineDash([5,5]);
    ctx.beginPath(); ctx.moveTo(400,0); ctx.lineTo(400,450); ctx.stroke();
    ctx.setLineDash([]);

    for (const p of platforms) { // 苔むした木の足場
        ctx.fillStyle = '#4a3a28'; ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.fillStyle = '#5fae4a'; ctx.fillRect(p.x, p.y, p.w, 4);
    }

    for (const c of clones) drawShape(ch.shape, c.x, c.y, 15, ch.color, c.guard ? 0.3 + 0.25 * c.hits : 0.55);
    drawShape(ch.shape, player.x, player.y, 15, ch.color, player.invuln > 0 ? 0.35 : 1);
    if (player.charge > 0) { // ルナのチャージ
        ctx.strokeStyle = player.charge >= 15 ? '#ffe97a' : '#888'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(player.x, player.y, 18 + player.charge / 6, 0, Math.PI * 2); ctx.stroke();
    }
    if (player.reflect > 0) { // ミラの反射バリア
        ctx.strokeStyle = '#d6c8ff'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(player.x, player.y, 38, 0, Math.PI * 2); ctx.stroke();
    }
    if (player.haste > 0) { // ハヤテの加速
        ctx.strokeStyle = '#9ff'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(player.x, player.y, 21, 0, Math.PI * 2); ctx.stroke();
    }

    if (pvp) drawOpp(); else drawBossShape(bossCfg, boss.x, boss.y, boss.w);

    // 弾は色ごとにまとめて描画（fillStyle切替とbeginPathの回数を削減）
    const groups = BSTYLE;
    for (const type in groups) {
        ctx.fillStyle = groups[type][0];
        ctx.beginPath();
        for (const b of bullets) {
            if (b.type !== type) continue;
            ctx.moveTo(b.x + groups[type][1], b.y);
            ctx.arc(b.x, b.y, groups[type][1], 0, Math.PI*2);
        }
        ctx.fill();
    }
    ctx.fillStyle = '#ff33ff';
    ctx.beginPath();
    for (const bb of bossBullets) { ctx.moveTo(bb.x + 6, bb.y); ctx.arc(bb.x, bb.y, 6, 0, Math.PI*2); }
    ctx.fill();

    if (online && pvp && !settled && (gameState === "clear" || gameState === "gameover")) settle(gameState === "clear");
    if (gameState === "paused") drawPause();
    if (gameState === "clear") overlay(pvp ? "YOU WIN!!" : "VICTORY!!", "#4eef90", pvp ? (netNote || "相手を倒しました！") : "精霊を鎮めました！おめでとう！");
    else if (gameState === "gameover") overlay(pvp ? "YOU LOSE..." : "DEFEAT...", "#ff5555", pvp ? "相手に倒されてしまいました..." : "精霊の力に倒れてしまった...");
    if (online && pvp && ratingNote && (gameState === "clear" || gameState === "gameover")) {
        ctx.fillStyle = "#ffe97a"; ctx.font = "bold 22px sans-serif"; ctx.textAlign = "center"; ctx.fillText(ratingNote, 400, 340);
    }
}

// --- 固定60fpsステップ（高リフレッシュレート画面でも速度が変わらない） ---
let last = performance.now(), acc = 0;
const STEP = 1000 / 60;
function loop(now) {
    const vis = gameState === "playing"; // スティックはプレイ中だけ表示
    if (vis !== stickVis) { stickVis = vis; stickEl.style.display = zoneEl.style.display = vis ? 'block' : 'none'; }
    pauseBtn.style.display = (vis && !pvp) ? 'block' : 'none';   // ポーズボタンはボス戦のプレイ中だけ
    acc += Math.min(now - last, 100);
    last = now;
    while (acc >= STEP) { update(); acc -= STEP; }
    draw();
    requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
